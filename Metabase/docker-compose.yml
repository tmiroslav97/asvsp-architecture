networks:
  asvsp:
    name: asvsp
    external: true
    
services:
  metabase-postgres:
    image: postgres:17.7
    container_name: mb-postgres
    hostname: mb-postgres
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabasedb
      POSTGRES_PASSWORD: metabasepass
    volumes:
      - metabase-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabasedb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - asvsp

  metabase:
    image: metabase/metabase:v0.65.2.2
    container_name: metabase
    hostname: metabase
    ports:
      - 3000:3000
    depends_on:
      metabase-postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabasedb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: metabasepass
      MB_DB_HOST: mb-postgres
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - asvsp

volumes:
  metabase-db-volume:
