name: hue

networks:
  asvsp:
    name: asvsp
    external: true

services:
  postgres-hue-db:
    image: postgres:17.7
    container_name: postgres-hue-db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: hue
      POSTGRES_PASSWORD: hue
    ports:
      - "5432:5432"
    volumes:
      - postgres-hue-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hue -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - asvsp

  hue:
    image: asvsp-hue:20260611-140101
    build: .
    container_name: hue
    hostname: hue
    dns: 8.8.8.8
    ports:
      - "8888:8888"
    # bind mount config (not working on all OS problems with permission)
    # volumes:
      # - ./config:/usr/share/hue/desktop/conf
    depends_on:
      postgres-hue-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8888/"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - asvsp

volumes:
  postgres-hue-db-volume:
