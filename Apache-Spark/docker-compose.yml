name: spark

networks:
  asvsp:
    name: asvsp
    external: true

x-spark: &spark
  image: asvsp-spark:4.2.0
  build: .
  env_file:
    - .env
  environment:
    PYSPARK_PYTHON: python3
  volumes:
    - ./examples:/home/examples:ro
  networks:
    - asvsp

services:
  spark-master:
    <<: *spark
    container_name: spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8000:8080"
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/"]
      interval: 5s
      timeout: 5s
      retries: 30

  spark-worker-1:
    <<: *spark
    container_name: spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8001:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30

  spark-worker-2:
    <<: *spark
    container_name: spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    depends_on:
      spark-master:
        condition: service_healthy
    ports:
      - "8002:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8081/"]
      interval: 5s
      timeout: 5s
      retries: 30
